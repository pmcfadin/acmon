# Agent CLI detectors — declarative data, not branching logic.
# Recognising a new CLI is an edit here, never a code change.
#
# Matching is on the RESOLVED EXECUTABLE PATH, never the process command name.
# Claude Code sets its process title to its version string, so a name-based match
# finds nothing at all.
#
# WHAT A DETECTOR DOES NOT BUY. A detector says which executables are an agent. It does
# not say where that CLI keeps its conversation log, and liveness is derived entirely from
# a transcript's modification time. So a CLI added here is listed, measured and attributed
# to a directory, and its state stays UNKNOWN — marked `!` in the display, with the reason
# printed beneath the table. Because WAITING is the only session state that is ever
# announced, such a session is monitored and never alerts. Recognising a fifth CLI is a
# data change; giving it a state is not.

[[detector]]
id = "claude"
# The executable's basename is a version string (e.g. "2.1.233"), so the identity
# lives in the containing path, not the filename. Observed:
#   /Users/<user>/.local/share/claude/versions/2.1.233
#   /Users/<user>/.claude/security/agent-sdk-venv/lib/python3.14/site-packages/claude_agent_sdk/_bundled/claude
exe_contains = ["/claude/versions/", "/claude_agent_sdk/_bundled/claude"]

[[detector]]
id = "codex"
# Anchored to the END of the path, not a substring. "codex" appears in paths that are
# emphatically not the CLI, and matching them is worse than missing the CLI: a resident
# desktop application makes a dead session look merely quiet, so the tool goes silent at
# the moment a session dies. All of these were observed running:
#   /Applications/ChatGPT.app/.../Codex Framework.framework/...        (desktop app)
#   ~/.codex/computer-use/.../SkyComputerUseClient                     (Computer Use)
#   .../vendor/aarch64-apple-darwin/bin/codex-code-mode-host           (helper, same bin dir)
# Only the last of these shares the CLI's directory, and a suffix rule still separates
# them. The real CLI, observed:
#   /opt/homebrew/lib/node_modules/@openai/codex/node_modules/@openai/codex-darwin-arm64/vendor/aarch64-apple-darwin/bin/codex
exe_ends_with = ["/bin/codex"]
